title = "ZhiTan public repository secret policy"

[extend]
useDefault = true

[[allowlists]]
description = "Explicit test and example sentinels"
regexTarget = "match"
regexes = [
  '''(?i)(?:test|example|replace|dummy|not-a-real)[-_a-z0-9]*''',
  '''11111111-1111-1111-1111-111111111111''',
  '''22222222-2222-2222-2222-222222222222'''
]
