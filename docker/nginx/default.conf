map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    # 运行镜像中的 Vite 构建产物由 Dockerfile.web 放在该目录。
    # 若缺失 root，try_files 回退 /index.html 会落到 Nginx 默认目录并触发内部重定向循环。
    root /usr/share/nginx/html;
    index index.html;

    # 与后端附件上限保持一致，超出后仍会由 API 给出明确错误。
    client_max_body_size 12m;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 流式对话需要直接透传事件。任何 buffering 或过短 read timeout 都会造成
    # 浏览器长时间空白后一次性收到内容，或在 Docling 解析期间被错误断开。
    location ^~ /api/career/ {
        proxy_pass http://career-api:8012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 15m;
        proxy_send_timeout 15m;
        add_header X-Accel-Buffering "no" always;
    }

    # 保留既有公众号审核与 Skill API 的同源访问方式，不改变它们的业务逻辑。
    location ^~ /api/ {
        proxy_pass http://career-api:8012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
